name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write       # OIDC token for Sigstore keyless signing
  attestations: write   # write the provenance attestation

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.vc.outputs.VERSION }}
      TAG: ${{ steps.vc.outputs.TAG }}
      SKIP: ${{ steps.vc.outputs.SKIP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check if version already released
        id: vc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping build"
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $TAG, proceeding with build"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    name: Build Windows + Linux
    needs: version-check
    if: needs.version-check.outputs.SKIP == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wine wine32 wine64 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 libgtk-3-0
          WINEDEBUG=-all wine wineboot --init || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build source
        run: npm run build

      - name: Build Windows distributables
        env:
          WINEDEBUG: "-all"
        run: npx electron-builder --win -c.electronDist=node_modules/electron/dist-win --publish never

      - name: Build Linux distributables
        run: npx electron-builder --linux -c.electronDist=node_modules/electron/dist-linux --publish never

      - name: Report build sizes
        run: |
          echo "=== Build output sizes ==="
          ls -lh out/*.exe out/*.AppImage out/*.deb 2>/dev/null || true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-desktop
          path: |
            out/*.exe
            out/*.AppImage
            out/*.deb
          if-no-files-found: error

  build-mac:
    name: Build macOS (arm64)
    needs: version-check
    if: needs.version-check.outputs.SKIP == 'false'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Signing is optional: with the secrets present the DMG is signed +
      # notarized; without them scripts/dist-mac.sh falls back to an ad-hoc build,
      # so forks/PRs without the secrets still get a working (unsigned) artifact.
      - name: Detect signing secrets
        id: signing
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/kcc-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write notary API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build macOS DMG
        env:
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist:mac

      - name: Report build size
        run: ls -lh out/*.dmg 2>/dev/null || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: out/*.dmg
          if-no-files-found: error

  release:
    name: Create Release
    needs: [version-check, build-desktop, build-mac]
    # Publish only from main. A workflow_dispatch on any other branch still runs
    # the build jobs (artifacts land in the workflow run for testing) but must
    # never create a real --latest release of unmerged code — the in-app update
    # checker would offer it to every user.
    if: needs.version-check.outputs.SKIP == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lh out/ 2>/dev/null || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/*.exe
            out/*.AppImage
            out/*.deb
            out/*.dmg

      - name: Generate release notes
        run: |
          git fetch --unshallow 2>/dev/null || true
          chmod +x scripts/generate-release-notes.sh
          scripts/generate-release-notes.sh "${{ needs.version-check.outputs.TAG }}" > /tmp/release-notes.md
          echo "--- Generated release notes ---"
          cat /tmp/release-notes.md

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=()
          for file in out/*.exe out/*.AppImage out/*.deb out/*.dmg; do
            [ -f "$file" ] || continue
            ASSETS+=("$file")
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "ERROR: No build artifacts found in out/"
            ls -la out/ 2>/dev/null || echo "out/ directory does not exist"
            exit 1
          fi

          echo "Uploading ${#ASSETS[@]} assets:"
          printf '  %s\n' "${ASSETS[@]}"

          gh release create "${{ needs.version-check.outputs.TAG }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ needs.version-check.outputs.TAG }}" \
            --notes-file /tmp/release-notes.md \
            --draft=false \
            --latest \
            "${ASSETS[@]}"
