name: Bug report
description: Something in the client is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please skim the open issues first — your problem may already be reported, and make sure you are on the latest version of the client.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS (Apple Silicon)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows installer (Setup.exe)
        - Windows portable (.exe)
        - Linux AppImage
        - macOS DMG
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: also-in-browser
    attributes:
      label: Does this also happen on krunker.io in a normal browser?
      description: The quickest way to tell a client bug from a Krunker bug.
      options:
        - No — only in the client
        - Yes — it happens in the browser too
        - Haven't tested
    validations:
      required: true

  - type: checkboxes
    id: ruled-out
    attributes:
      label: Already ruled out
      description: Userscripts, swapped files and CSS themes are behind most reports, so checking these first usually saves a round trip. The Userscripts and Resource Swapper toggles need a client restart to take effect.
      options:
        - label: Still happens with Userscripts disabled
        - label: Still happens with the Resource Swapper disabled
        - label: Still happens with CSS Theme set to Disabled

  - type: dropdown
    id: fps-limit
    attributes:
      label: FPS Limit setting
      description: Settings → Client → Performance → Frame Rate. Frame pacing is behind a lot of stutter and input bugs, so it is worth knowing even when the bug looks unrelated.
      options:
        - Unlimited
        - Custom Cap
        - Vsync
        - Not sure
